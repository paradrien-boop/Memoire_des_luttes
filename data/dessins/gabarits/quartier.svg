<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 300">
<!-- Gabarit du quartier : cadre 400 × 300. Le fond (quartier/fond) remplit tout le cadre ; chaque élément (quartier/<famille>-<niveau>) se dessine dans sa zone, sur fond transparent.
     Dessine sur un calque à toi, dans ce cadre, SANS changer la taille du document (viewBox).
     Avant d'enregistrer : supprime le calque « Repères » (ou masque-le), et garde un fond transparent. -->
<g id="reperes" inkscape:groupmode="layer" inkscape:label="Repères (à supprimer)" opacity=".8"><rect x="0" y="0" width="400" height="300" fill="none" stroke="#2B6CB0" stroke-width="1" stroke-dasharray="4 3"/><text x="3" y="9" font-family="sans-serif" font-size="6" fill="#2B6CB0" text-anchor="start">Fond : ciel, immeubles, rue (quartier/fond)</text><rect x="12" y="112" width="96" height="70" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="15" y="121" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">personnalite : fresque murale</text><rect x="18" y="184" width="84" height="50" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="21" y="193" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">concept : atelier coopératif</text><rect x="130" y="24" width="140" height="36" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="133" y="33" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">mesure : enseigne de la Bourse du travail</text><rect x="172" y="156" width="52" height="78" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="175" y="165" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">mesure : porte</text><rect x="226" y="180" width="38" height="56" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="229" y="189" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">lieu : plaque et fleurs</text><rect x="130" y="138" width="46" height="64" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="133" y="147" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">courant : affiches</text><rect x="284" y="154" width="106" height="82" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="287" y="163" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">livre : bibliothèque</text><rect x="118" y="90" width="162" height="32" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="121" y="99" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">evenement : banderole</text><rect x="6" y="174" width="140" height="104" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="9" y="183" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">evenement : barricade (niveau 3)</text><rect x="292" y="212" width="96" height="80" fill="none" stroke="#E0245E" stroke-width="1" stroke-dasharray="4 3"/><text x="295" y="221" font-family="sans-serif" font-size="6" fill="#E0245E" text-anchor="start">chant : kiosque à musique</text><rect x="160" y="196" width="80" height="92" fill="none" stroke="#38A169" stroke-width="1" stroke-dasharray="4 3"/><text x="163" y="205" font-family="sans-serif" font-size="6" fill="#38A169" text-anchor="start">chat (garder libre)</text><rect x="120" y="182" width="40" height="108" fill="none" stroke="#38A169" stroke-width="1" stroke-dasharray="4 3"/><text x="123" y="191" font-family="sans-serif" font-size="6" fill="#38A169" text-anchor="start">personnage (garder libre)</text><line x1="0" y1="234" x2="400" y2="234" stroke="#2B6CB0" stroke-width="1"/><text x="396" y="230" font-family="sans-serif" font-size="6" fill="#2B6CB0" text-anchor="end">trottoir (y = 234)</text><line x1="0" y1="248" x2="400" y2="248" stroke="#2B6CB0" stroke-width="1"/><text x="396" y="258" font-family="sans-serif" font-size="6" fill="#2B6CB0" text-anchor="end">chaussée (y = 248) : les passants marchent ici</text></g>
</svg>
