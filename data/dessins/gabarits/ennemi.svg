<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="-60 -170 120 180">
<!-- Gabarit d'un adversaire : cadre 120 × 180, point (0,0) entre les pieds.
     Dessine sur un calque à toi, dans ce cadre, SANS changer la taille du document (viewBox).
     Avant d'enregistrer : supprime le calque « Repères » (ou masque-le), et garde un fond transparent. -->
<g id="reperes" inkscape:groupmode="layer" inkscape:label="Repères (à supprimer)" opacity=".8"><rect x="-60" y="-170" width="120" height="180" fill="none" stroke="#2B6CB0" stroke-width=".5" stroke-dasharray="2 2"/><line x1="-60" y1="0" x2="60" y2="0" stroke="#E0245E" stroke-width=".6"/><text x="-58" y="-2" font-family="sans-serif" font-size="4" fill="#E0245E" text-anchor="start">sol : les pieds posent ici</text><circle cx="0" cy="0" r="1.5" fill="#E0245E"/><circle cx="0" cy="-98" r="12" fill="none" stroke="#2B6CB0" stroke-width=".5" stroke-dasharray="1.5 1.5"/><text x="0" y="-113" font-family="sans-serif" font-size="4.5" fill="#2B6CB0" text-anchor="middle">tête (centre 0, -98)</text><rect x="-16" y="-82" width="32" height="44" fill="none" stroke="#2B6CB0" stroke-width=".5" stroke-dasharray="1.5 1.5"/><text x="0" y="-60" font-family="sans-serif" font-size="4.5" fill="#2B6CB0" text-anchor="middle">haut</text><text x="0" y="-158" font-family="sans-serif" font-size="3.6" fill="#E0245E" text-anchor="middle">L'adversaire regarde vers la gauche (vers le personnage)</text><circle cx="-34" cy="-72" r="4" fill="none" stroke="#E0245E" stroke-width=".6"/><text x="-34" y="-80" font-family="sans-serif" font-size="3.6" fill="#2B6CB0" text-anchor="middle">main tendue</text></g>
</svg>
