# Publie le site, l'app (sous /app/) et les packs (sous /packs/) à chaque envoi sur main.
# Destination : le dépôt public paradrien-boop/memoire-des-luttes-publication (branche main), servi par GitHub Pages :
#   https://paradrien-boop.github.io/memoire-des-luttes-publication/app/
# Pour migrer plus tard (Codeberg, compte du collectif…), il suffit de changer la variable DEPOT_PUBLICATION
# et l'adresse git ci-dessous. Voir docs/publication.md.
name: Publier

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: publication

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      DEPOT: ${{ vars.DEPOT_PUBLICATION || 'paradrien-boop/memoire-des-luttes-publication' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run valider
      - run: npm test
      - name: Construire le site, l'app et les packs (vérifie aussi l'absence de la clé de démonstration)
        run: npm run publier
      - name: Envoyer la publication vers le dépôt public
        env:
          JETON: ${{ secrets.PUBLICATION_JETON }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::notice title=Publication non envoyée::Le secret PUBLICATION_JETON n'existe pas encore. Tout est construit et vérifié, mais rien n'est envoyé. Voir docs/publication.md."
            exit 0
          fi
          cd publication
          PROPRIETAIRE="${DEPOT%%/*}"; NOM="${DEPOT#*/}"
          printf '# Mémoire des luttes — publication\n\nVersion publiée, écrite automatiquement : ne pas modifier à la main.\n\n- L'"'"'app : https://%s.github.io/%s/app/\n- Le site : https://%s.github.io/%s/\n\nCode sous licence AGPL-3.0, cartes sous licence CC BY-SA 4.0.\n' "$PROPRIETAIRE" "$NOM" "$PROPRIETAIRE" "$NOM" > README.md
          git init -q -b main
          git add -A
          git -c user.name="Mémoire des luttes" -c user.email="publication@invalid" commit -q -m "Publication"
          for attente in 0 10 30 60; do
            sleep $attente
            if git push --force -q "https://x-access-token:${JETON}@github.com/${DEPOT}.git" main; then
              echo "::notice title=Publié::https://${PROPRIETAIRE}.github.io/${NOM}/app/"
              exit 0
            fi
            echo "Envoi refusé, nouvel essai…"
          done
          echo "::error::L'envoi a échoué. Si l'erreur est 401 ou 403, vérifie que le jeton PUBLICATION_JETON a bien le droit d'écrire (Contents : Read and write) sur ${DEPOT}."
          exit 1
