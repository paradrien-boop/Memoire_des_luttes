name: Vérifier

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier le contenu des cartes
        run: npm run valider
      - name: Vérifier que prototype/donnees.js est à jour
        run: node scripts/construire.mjs --verifier
      - name: Tests du noyau
        run: npm test
      - name: Vérifier les types de l'app
        run: npm run check
      - name: Construire l'app, le site et la publication
        run: npm run publier
      - name: Vérifier que la clé de démonstration n'est pas dans l'app publiée
        run: |
          if grep -rq "$(node -p "require('./data/cles/demo.json').publique")" app/dist; then echo "La clé de démonstration se trouve dans l'app publiée !"; exit 1; fi

  bout-en-bout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (parcours, quiz, QR, packs signés, mode avion)
        run: npm run test:e2e

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Numéro de version (nombre de modifications du dépôt, le même partout et toujours croissant)
        run: echo "MDL_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Construire l'application Android (APK)
        run: |
          npm run android -w app
          cd app/android && ./gradlew assembleRelease --no-daemon -q
      - name: Garder l'APK (onglet Actions, rubrique Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: memoire-des-luttes-android
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
