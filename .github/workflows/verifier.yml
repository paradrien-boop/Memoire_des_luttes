name: Vérifier

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier le contenu des cartes
        run: npm run valider
      - name: Vérifier que prototype/donnees.js est à jour
        run: node scripts/construire.mjs --verifier
      - name: Tests du noyau
        run: npm test
      - name: Vérifier les types de l'app
        run: npm run check
      - name: Construire l'app
        run: npm run build
