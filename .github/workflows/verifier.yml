name: Vérifier les cartes

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier le contenu des cartes
        run: node scripts/valider.mjs
      - name: Vérifier que app/donnees.js est à jour
        run: node scripts/construire.mjs --verifier
