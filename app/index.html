<title>Mémoire des luttes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout : appli mobile à onglets fixes en bas ; cartes imprimées façon affiche risographe (encre rouge + noire sur papier) */
:root{
  --paper:#E9E6E1; --ink:#1C1816; --red:#CF2318; --on-red:#FFF8F2; --muted:#6B625C;
  --line:#CBC4BB; --card:#F6F4F0; --gold:#A87A10; --dot:rgba(207,35,24,.55);
  --f-display:"Big Shoulders Display","Impact","Arial Narrow",sans-serif;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-text:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151210; --ink:#EEE7DE; --red:#EE4236; --on-red:#1A0705; --muted:#A3988E;
  --line:#3A322C; --card:#211C19; --gold:#E2B54E; --dot:rgba(238,66,54,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151210; --ink:#EEE7DE; --red:#EE4236; --on-red:#1A0705; --muted:#A3988E;
  --line:#3A322C; --card:#211C19; --gold:#E2B54E; --dot:rgba(238,66,54,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
main{max-width:760px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:44px;font-weight:900;letter-spacing:.01em}
h2{font-size:28px;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink);
  padding:10px 16px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
button.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
button.ink{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.mini:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:2px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:70px;font-family:var(--f-text);font-size:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
label small{font-weight:400;color:var(--muted)}
hr{border:0;border-top:2px solid var(--ink);margin:6px 0}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:4px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
.mast .mark{font-family:var(--f-display);font-weight:900;font-size:15px;text-transform:uppercase;line-height:1;color:var(--red);text-align:right}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
nav.tabs a{color:var(--paper);text-decoration:none;text-align:center;padding:12px 4px 13px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;position:relative}
nav.tabs a .ic{display:block;font-family:var(--f-display);font-size:22px;line-height:1;margin-bottom:3px}
nav.tabs a[aria-current="page"]{background:var(--red);color:var(--on-red)}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 10px);background:var(--paper);color:var(--ink);border-radius:9px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}

/* manif */
.session{border:3px solid var(--ink);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px}
.session.on{border-color:var(--red)}
.clock{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.session.on .clock{color:var(--red)}
.bar{height:12px;border:2px solid var(--ink);background:transparent;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);width:0}
.bigbtn{font-family:var(--f-display);font-size:30px;font-weight:900;padding:14px 18px;width:100%;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--ink)}
.stats div{padding:10px 12px;border-right:2px solid var(--ink)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-display);font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pack{display:flex;gap:16px;align-items:center;border:3px dashed var(--red);padding:16px}
.pack .envelope{flex:none;width:74px;aspect-ratio:5/7;background:var(--red);color:var(--on-red);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;font-size:30px;transform:rotate(-4deg);box-shadow:5px 5px 0 var(--ink)}
.pack .grow{flex:1;min-width:0}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.check input{width:auto}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* cards */
.card{background:var(--card);border:2px solid var(--ink);width:100%;max-width:380px;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--ink)}
.c-top{display:flex;justify-content:space-between;padding:6px 10px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.r-rare .c-top{background:var(--red);color:var(--on-red)}
.r-legendaire .c-top{background:var(--gold);color:var(--card)}
.r-legendaire{border-color:var(--gold);box-shadow:6px 6px 0 var(--gold)}
.c-art{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:2px solid var(--ink);
  background:radial-gradient(var(--dot) 34%,transparent 36%) 0 0/9px 9px,var(--card)}
.c-art span{font-family:var(--f-display);font-weight:900;font-size:92px;line-height:1;color:var(--ink);letter-spacing:-.02em;mix-blend-mode:normal}
.c-art img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.c-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.c-title{font-size:30px;font-weight:900}
.c-dates{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--red);letter-spacing:.04em;margin-top:2px}
.c-body h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.c-body p{font-family:var(--f-text);font-size:14.5px;line-height:1.5}
.why{border-left:4px solid var(--red);padding-left:10px}
blockquote{margin:0;font-family:var(--f-text);font-style:italic;font-size:16px;line-height:1.4;padding:8px 0;border-block:1.5px solid var(--line)}
blockquote cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;border:1.5px solid var(--ink);padding:3px 8px;border-radius:20px;background:transparent;text-transform:none;letter-spacing:0}
.chip.locked{border-style:dashed;color:var(--muted);border-color:var(--line);cursor:default}
.c-foot{font-size:11px;color:var(--muted);border-top:1.5px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.c-foot .seal{font-weight:700;color:var(--gold)}

.r-evenement{border:3px double var(--red);box-shadow:6px 6px 0 var(--red)}
.r-evenement .c-top{background:repeating-linear-gradient(-45deg,var(--red) 0 8px,var(--ink) 8px 16px);color:var(--on-red)}
.r-evenement .c-top span{background:var(--red);padding:0 4px}
.serial{position:absolute;right:8px;bottom:8px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:900;font-size:18px;padding:2px 8px;font-variant-numeric:tabular-nums}
/* mini cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px}
.mini{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:5/7;max-width:100%;background:var(--card);border:2px solid var(--ink);display:flex;flex-direction:column;position:relative;box-shadow:3px 3px 0 var(--ink)}
.mini.r-rare{border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.mini.r-legendaire{border-color:var(--gold);box-shadow:3px 3px 0 var(--gold)}
.mini.r-evenement{border:3px double var(--red);box-shadow:3px 3px 0 var(--ink)}
.mini .m-art{flex:1;display:grid;place-items:center;overflow:hidden;background:radial-gradient(var(--dot) 34%,transparent 36%) 0 0/7px 7px}
.mini .m-art span{font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--ink)}
.mini .m-art img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply}
.mini .m-t{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:15px;line-height:1;padding:6px 6px 2px;text-wrap:balance}
.mini .m-f{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 6px 6px;font-weight:700}
.mini .m-n{position:absolute;top:4px;right:4px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;padding:0 5px}
.mini .m-new{position:absolute;top:4px;left:4px;background:var(--red);color:var(--on-red);font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.06em}
.mini.locked{border-style:dashed;border-color:var(--line);box-shadow:none;cursor:default;background:transparent}
.mini.locked .m-art{background:none}
.mini.locked .m-art span{color:var(--line);font-size:46px}
.series{display:flex;flex-direction:column;gap:12px;padding-block:6px 18px}
.series-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.series-head .count{font-family:var(--f-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;color:var(--red)}
.series.done .series-head{border-color:var(--red)}

/* overlay */
.overlay{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .inner{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
.reveal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;padding-right:4px}
.flip{perspective:900px;cursor:pointer;min-width:0}
.flip-inner{position:relative;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.flip .front{transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--red);border:2px solid var(--ink);
  display:grid;place-items:center;color:var(--on-red);font-family:var(--f-display);font-weight:900;font-size:44px;
  background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.12) 10px 20px)}
.flip .front .mini{width:100%}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.ed .preview{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:700px){.ed{grid-template-columns:minmax(0,1fr)}.ed .preview{position:static;order:-1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mylist{display:flex;flex-direction:column;gap:8px}
.mylist .it{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);padding:8px 10px;background:var(--card)}
.mylist .it b{font-family:var(--f-display);text-transform:uppercase;font-size:18px;min-width:0;overflow-wrap:anywhere}
.mylist .it button{padding:5px 9px;font-size:11px}
.panel{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.panel textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:120px}
.trust{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.trust b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);
  padding:10px 16px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
</style>

 {id:"commune",series:"72j",fam:"evenement",rar:"legendaire",title:"La Commune de Paris",dates:"18 mars – 28 mai 1871",lieu:"Paris",
  fait:"Après la défaite contre la Prusse et un siège qui a affamé la ville, le peuple de Paris refuse de rendre ses canons au gouvernement d'Adolphe Thiers. Le 26 mars, Paris élit son propre conseil : la Commune. Pendant 72 jours, la ville s'administre elle-même.",

 {id:"18mars",series:"72j",fam:"evenement",rar:"rare",title:"Les canons de Montmartre",dates:"18 mars 1871",lieu:"Butte Montmartre",
  fait:"À l'aube, l'armée vient saisir les canons de la Garde nationale, payés par souscription des Parisiens. Les femmes du quartier donnent l'alerte, la foule entoure les soldats, et ceux-ci refusent de tirer. Thiers et son gouvernement fuient à Versailles.",

 {id:"separation",series:"72j",fam:"mesure",rar:"base",title:"Séparer l'Église et l'État",dates:"2 avril 1871",
  fait:"Par décret, la Commune sépare l'Église de l'État, supprime le budget des cultes et déclare propriété nationale les biens des congrégations religieuses. Elle lance aussi une école laïque et gratuite.",

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const STOP = new Set(["le","la","les","de","des","du","l","d","aux","au","et","en","pour","plus","a"]);
function initials(t){ const w = String(t||"?").split(/[\s'’-]+/).filter(x=>x && !STOP.has(x.toLowerCase())); return (w.slice(0,2).map(x=>x[0]).join("")||"?").toUpperCase(); }
function allCards(){ const m = {}; OFFICIAL.forEach(c=>m[c.id]={...c,origin:"officiel"}); S.mine.forEach(c=>m[c.id]={...c,origin:"perso"}); S.imported.forEach(p=>p.cartes.forEach(c=>m[c.id]={...c,origin:"importe",packName:p.nom})); S.events.forEach(e=>{ if(EVENTS[e.id]) m[e.id]={...EVENTS[e.id],serial:e.serial,origin:"event"}; }); return m; }
function isOwned(c){ return c.origin!=="officiel" || (S.owned[c.id]||0)>0; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* ============ RENDU DES CARTES ============ */
function artHTML(c, cls){ return c.img ? `<img src="${esc(c.img)}" alt="">` : `<span>${esc(initials(c.title))}</span>`; }
function cardHTML(c){
  const all = allCards();
  const sch = (FAMS[c.fam]||FAMS.evenement).fields;
  const subs = sch.filter(f=>f.kind==="sub" && c[f.k]).map(f=>esc(c[f.k])).join(" · ");
  const qsrc = c.phraseSrc && sch.some(f=>f.kind==="quoteSrc") ? `<cite>${esc(c.phraseSrc)}</cite>` : "";
  const body = sch.map(f=>{
    const v = c[f.k]; if(!v) return "";
    if(f.kind==="text"||f.kind==="more") return `<div><h4>${esc(f.label)}</h4><p>${esc(v)}</p></div>`;
    if(f.kind==="why") return `<div class="why"><h4>${esc(f.label)}</h4><p>${esc(v)}</p></div>`;
    if(f.kind==="quote") return `<blockquote>« ${esc(v)} »${qsrc}</blockquote>`;
    return "";
  }).join("");
  const links = (c.links||[]).map(id=>all[id]).filter(Boolean).map(l => isOwned(l)
     ? `<button class="chip" data-open="${esc(l.id)}">${esc(l.title)}</button>`
     : `<span class="chip locked">? carte à trouver</span>`).join("");
  const seal = c.origin==="officiel" ? `<span class="seal">✊ Pack officiel</span>`
    : c.origin==="event" ? `<span class="seal">🔒 Scellée par le collectif · non modifiable</span>`
    : c.origin==="importe" ? `<span>Pack importé, non signé : ${esc(c.packName||"")}</span>` : `<span>Carte perso</span>`;
  const serial = c.serial ? `<div class="serial">N° ${String(c.serial).padStart(4,"0")} / ${esc(c.tirage)}</div>` : "";
  return `<article class="card r-${esc(c.rar)}">
    <header class="c-top"><span>${esc(RAR[c.rar]||"")}</span><span>${esc(FAM[c.fam]||"")}</span></header>
    <div class="c-art">${artHTML(c)}${serial}</div>
    <div class="c-body">
      <div><h3 class="c-title">${esc(c.title||"Sans titre")}</h3>${subs?`<div class="c-dates">${subs}</div>`:""}</div>
      ${body}
      ${links?`<div><h4>Liée à</h4><div class="chips">${links}</div></div>`:""}
      <div class="c-foot">${seal}<span>${esc(c.src||"")}</span></div>
    </div></article>`;
}
function miniHTML(c, opts={}){
  const n = S.owned[c.id]||0;
  return `<button class="mini r-${esc(c.rar)}" data-open="${esc(c.id)}" aria-label="${esc(c.title)}">
    <div class="m-art">${artHTML(c)}</div><div class="m-t">${esc(c.title)}</div><div class="m-f">${esc(FAM[c.fam]||"")}</div>
    ${opts.isNew?`<span class="m-new">NOUVELLE</span>`:""}${(!opts.hideCount && n>1)?`<span class="m-n">×${n}</span>`:""}</button>`;
}
function lockedHTML(c, i){ return `<div class="mini locked" aria-label="Carte non trouvée"><div class="m-art"><span>?</span></div><div class="m-t muted">N° ${i}</div><div class="m-f">${esc(RAR[c.rar])}</div></div>`; }

function openCard(id){
  const c = allCards()[id]; if(!c || !isOwned(c)) return;
  const ov = $("#ov");
  const act = c.origin==="perso" ? `<button class="primary" data-editcard="${esc(c.id)}">Modifier</button>`
    : (c.origin==="officiel"||c.origin==="event") ? `<span class="muted" style="font-size:13px;text-align:center">Carte signée : personne ne peut la modifier, pas même toi.</span>` : "";
  ov.innerHTML = `<div class="inner">${cardHTML(c)}${act}<button class="ink" data-close>Fermer</button></div>`;
  ov.hidden = false; ov.scrollTop = 0;

});

/* ============ TEMPS DE MANIF ============ */
function tick(){
  if(!S.sess) return;
  const now = Date.now();
  let dt = Math.max(0, now - S.sess.last);
  dt = Math.min(dt, 4*3600e3);              // pas plus de 4 h d'un coup
  S.sess.eff += dt * (S.speed||1);
  S.sess.last = now;
  const d = todayStr(); if(S.today.d!==d) S.today = {d, n:0};
  const target = Math.floor(S.sess.eff / (BOOSTER_MIN*60e3));
  while(S.sess.credited < target){
    S.sess.credited++;
    if(S.today.n < DAY_CAP){ S.today.n++; S.boosters++; toast("Nouveau booster gagné !"); }
  }
  if(S.sess.eff >= 60*60e3 && !S.days.includes(d)){ S.days.push(d); toast("Jour de manif validé : "+S.days.length+" au compteur"); }
  save();
}
function fmt(ms){ const s=Math.floor(ms/1000); return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":"); }

/* ============ BOOSTERS ============ */
const pick = a => a[Math.floor(Math.random()*a.length)];
function rollRarity(){ const r=Math.random(); return r<.06?"legendaire":r<.32?"rare":"base"; }
function drawBooster(min){
  const out = [];
  for(let i=0;i<3;i++){
    let rar = rollRarity();
    if(i===2){
      if(min==="legendaire") rar="legendaire";
      else if((min==="rare" || S.pity>=3) && rar==="base") rar="rare";
    }
    out.push(pick(OFFICIAL.filter(c=>c.rar===rar)));
  }
  S.pity = out.some(c=>c.rar!=="base") ? 0 : S.pity+1;
  return out;
}
function openBooster(min, label){
  if(!min){ if(S.boosters<1) return; S.boosters--; }
  const cards = drawBooster(min);
  const isNew = cards.map(c=>!(S.owned[c.id]>0));
  // un doublon dans le même booster n'est "nouveau" qu'une fois
  const seen = new Set(); cards.forEach((c,i)=>{ if(seen.has(c.id)) isNew[i]=false; seen.add(c.id); });
  cards.forEach(c=>S.owned[c.id]=(S.owned[c.id]||0)+1);
  S.opened++; save();
  const ov = $("#ov");
  ov.innerHTML = `<div class="inner">
    <div class="eyebrow">${esc(label||"Booster")}</div>
    <h2 style="text-align:center">Touche les cartes pour les retourner</h2>
    <div class="reveal">${cards.map((c,i)=>`<div class="flip" data-i="${i}"><div class="flip-inner"><div class="back">✊</div><div class="front">${miniHTML(c,{isNew:isNew[i],hideCount:true})}</div></div></div>`).join("")}</div>
    <p class="muted" id="rv-msg" style="text-align:center">Une fois retournée, touche une carte pour la lire.</p>
    <div class="row"><button class="primary" id="rv-all">Tout retourner</button><button class="ink" data-close>Ranger dans l'album</button></div></div>`;
  ov.hidden = false; ov.scrollTop = 0;
  ov.querySelectorAll(".flip").forEach(f=>f.addEventListener("click",e=>{ if(!f.classList.contains("open")){ f.classList.add("open"); e.stopPropagation(); } }));
  $("#rv-all").onclick = ()=>ov.querySelectorAll(".flip").forEach(f=>f.classList.add("open"));
}

    </div>

    <section class="panel">
      <div><div class="eyebrow">Stand, tract, banderole</div><h2>Code de stand</h2></div>
      <p style="font-size:14px">Dans la vraie version, on scanne le QR code collé sur un stand ou un tract. Il donne un booster spécial avec une carte rare garantie. Ici, tape le code imprimé sous le QR. À essayer : <b>COMMUNE-71</b>, <b>MUR-28-MAI</b>, ou <b>18-MARS-2027</b> pour une carte d'événement scellée.</p>
      <form class="row" id="codeform"><input id="code" style="flex:1;min-width:0" placeholder="Code du stand" autocomplete="off"><button class="ink">Valider</button></form>
    </section>
  </div>`;
}
function bindManif(){
  $("#sessbtn").onclick = ()=>{
    if(S.sess){ tick(); S.sess=null; toast("Manif terminée. À la prochaine !"); }
    else { S.sess={start:Date.now(),last:Date.now(),eff:0,credited:0}; toast("C'est parti. Bonne manif !"); }
    save(); render();
  };
  $("#speed").onchange = e=>{ tick(); S.speed = e.target.checked?60:1; save(); };
  $("#openb").onclick = ()=>openBooster(null,"Booster");
  $("#codeform").onsubmit = e=>{
    e.preventDefault();
    const code = $("#code").value.trim().toUpperCase(), def = STAND_CODES[code];
    if(!def){ toast("Code inconnu. Vérifie l'orthographe."); return; }
    if(S.codes.includes(code)){ toast("Ce code a déjà été utilisé sur ce téléphone."); return; }
    S.codes.push(code);
    if(def.event){
      const ev = EVENTS[def.event];
      S.events.push({id:ev.id, serial:1+Math.floor(Math.random()*ev.tirage), date:todayStr()}); save();
      toast("Carte d'événement ajoutée à ton album !"); openCard(ev.id); return;
    }
    save(); openBooster(def.min, def.label);
  };
}

function vAlbum(){
  const all = allCards();
  const ownedN = OFFICIAL.filter(c=>S.owned[c.id]>0).length;
  let num = 0;
  const series = SERIES.map(sr=>{
    const cs = OFFICIAL.filter(c=>c.series===sr.id);
    const got = cs.filter(c=>S.owned[c.id]>0).length;
    return `<section class="series ${got===cs.length?"done":""}">
      <div class="series-head"><div><h2>${esc(sr.nom)}</h2><div class="muted" style="font-size:13px">${esc(sr.desc)}${got===cs.length?" · <b style='color:var(--red)'>Série complète !</b>":""}</div></div><span class="count">${got}/${cs.length}</span></div>
      <div class="grid">${cs.map(c=>{num++; return S.owned[c.id]>0?miniHTML(c):lockedHTML(c,num);}).join("")}</div></section>`;
  }).join("");
  const mine = S.mine.length?`<section class="series"><div class="series-head"><div><h2>Mes cartes</h2><div class="muted" style="font-size:13px">Faites avec l'éditeur. Elles ne tombent pas dans les boosters.</div></div><span class="count">${S.mine.length}</span></div><div class="grid">${S.mine.map(c=>miniHTML(c)).join("")}</div></section>`:"";
  const imp = S.imported.map(p=>`<section class="series"><div class="series-head"><div><h2>${esc(p.nom)}</h2><div class="muted" style="font-size:13px">Pack importé, non signé</div></div><span class="count">${p.cartes.length}</span></div><div class="grid">${p.cartes.map(c=>miniHTML(c)).join("")}</div></section>`).join("");
  const evs = Object.values(all).filter(c=>c.origin==="event");
  const evSec = `<section class="series"><div class="series-head"><div><h2>Cartes d'événement</h2><div class="muted" style="font-size:13px">Uniques, numérotées, scellées. On ne les obtient qu'en étant sur place le jour J.</div></div><span class="count">${evs.length}</span></div>
    ${evs.length?`<div class="grid">${evs.map(c=>miniHTML(c)).join("")}</div>`:`<p class="muted" style="font-size:14px">Aucune pour l'instant. Elles se gagnent en scannant le QR d'un stand officiel pendant une manif.</p>`}</section>`;
  return `<header class="mast"><div><div class="eyebrow">Ta collection</div><h1>Album</h1></div><div class="mark" style="font-size:40px">${ownedN}/${OFFICIAL.length}</div></header>
  <div class="stack">${evSec}${series}${mine}${imp}</div>`;
}

const EMPTY = {id:"",title:"",fam:"evenement",rar:"base",dates:"",fait:"",pourquoi:"",phrase:"",phraseSrc:"",plus:"",src:"",links:[],img:""};
let ED = null;
function vEditeur(){
  if(!ED) ED = S.draft ? {...EMPTY,...S.draft} : {...EMPTY};
  const famOpts = Object.entries(FAMS).map(([k,v])=>v.official
      ? `<option value="${k}" disabled>${v.label} (réservée au collectif)</option>`
      : `<option value="${k}" ${ED.fam===k?"selected":""}>${v.label}</option>`).join("");
  const rarOpts = ["base","rare","legendaire"].map(k=>`<option value="${k}" ${ED.rar===k?"selected":""}>${RAR[k]}</option>`).join("");
  const fieldHTML = f=>{
    if(f.kind==="title") return "";
    const lab = `${esc(f.label)}${f.req?" *":""}${f.hint?` <small>${esc(f.hint)}</small>`:""}`;
    const v = esc(ED[f.k]||""), max = f.max?` maxlength="${f.max}"`:"", ph = f.ph?` placeholder="${esc(f.ph)}"`:"";
    return f.area ? `<label>${lab}<textarea id="e-${f.k}"${max}${ph}>${v}</textarea></label>`
                  : `<label>${lab}<input id="e-${f.k}" value="${v}"${max}${ph}></label>`;
  };
  const sch = FAMS[ED.fam].fields, tf = sch.find(f=>f.kind==="title");
  return `<header class="mast"><div><div class="eyebrow">Fais tes propres cartes</div><h1>Éditeur</h1></div><div class="mark">Hors ligne<br>et anonyme</div></header>
  <div class="ed">
    <form class="stack" id="edform" autocomplete="off">
      <div class="two"><label>Famille<select id="e-fam">${famOpts}</select></label><label>Rareté proposée<select id="e-rar">${rarOpts}</select></label></div>
      <p class="note">Les rubriques changent selon la famille. Ce que tu as déjà écrit est gardé si tu changes d'avis.</p>
      <label>${esc(tf.label)} *<input id="e-title" value="${esc(ED.title)}" placeholder="${esc(tf.ph||"")}"></label>
      ${sch.map(fieldHTML).join("")}
      <label>Sources <small>Obligatoire pour proposer la carte au pack officiel.</small><input id="e-src" value="${esc(ED.src)}" placeholder="Ex. : Wikipédia, Le Maitron…"></label>
      <label>Image <small>Elle est réduite et passée en noir et blanc. Elle reste dans le téléphone.</small><input type="file" id="e-img" accept="image/*"></label>
      ${ED.img?`<div><button type="button" id="e-noimg">Retirer l'image</button></div>`:""}
      <div class="row"><button class="primary" id="e-save">${ED.id?"Enregistrer les changements":"Enregistrer la carte"}</button><button type="button" id="e-new">Nouvelle carte</button></div>
    </form>
    <div class="preview stack"><div class="eyebrow">Aperçu</div><div id="e-prev">${cardHTML({...ED,origin:"perso"})}</div></div>
  </div>

  <div class="stack" style="margin-top:30px">
    <section class="stack"><div class="series-head"><h2>Mes cartes</h2><span class="count" style="font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--red)">${S.mine.length}</span></div>
      ${S.mine.length?`<div class="mylist">${S.mine.map(c=>`<div class="it"><b>${esc(c.title)}</b><div class="row" style="flex:none"><button data-edit="${esc(c.id)}">Modifier</button><button data-del="${esc(c.id)}">Supprimer</button></div></div>`).join("")}</div>`:`<p class="muted">Tu n'as pas encore fait de carte. Remplis le formulaire au-dessus : l'aperçu se met à jour pendant que tu écris.</p>`}
    </section>

    <section class="panel">
      <div><div class="eyebrow">Partager</div><h2>Exporter un pack</h2></div>
      <p style="font-size:14px">Regroupe tes cartes dans un pack, puis copie le texte du fichier pour le passer à un·e camarade. Dans la vraie version, il pourra aussi s'envoyer de téléphone à téléphone par QR code.</p>
      <label>Nom du pack<input id="p-name" placeholder="Ex. : Grèves de ma ville"></label>
      <div class="row"><button class="ink" id="p-gen" ${S.mine.length?"":"disabled"}>Générer le pack</button><button id="p-copy" hidden>Copier</button></div>
      <textarea id="p-out" readonly hidden></textarea>
    </section>

    <section class="panel">
      <div><div class="eyebrow">Recevoir</div><h2>Importer un pack</h2></div>
      <p style="font-size:14px">Colle le texte d'un pack ou choisis son fichier. Un pack non signé reste dans ton album mais ne tombe jamais dans les boosters.</p>
      <textarea id="i-in" placeholder='{"format":"memoire-des-luttes/pack", …}'></textarea>
      <div class="row"><button class="ink" id="i-go">Importer le texte</button><label class="btn" style="flex-direction:row">Choisir un fichier<input type="file" id="i-file" accept=".json,application/json,text/plain" hidden></label></div>
    </section>
  </div>`;
}
function readForm(){
  FAMS[ED.fam].fields.forEach(f=>{ const el=$("#e-"+f.k); if(el) ED[f.k]=el.value; });
  ED.src=$("#e-src").value; ED.rar=$("#e-rar").value;
}
function refreshPreview(){ $("#e-prev").innerHTML = cardHTML({...ED,origin:"perso"}); }
function bindEditeur(){
  const f = $("#edform");
  f.addEventListener("input", e=>{
    if(e.target.id==="e-fam"){ readForm(); ED.fam=e.target.value; S.draft={...ED}; save(); render(); return; }
    readForm(); S.draft={...ED}; save(); refreshPreview(); });
  f.onsubmit = e=>{
    e.preventDefault(); readForm();
    const miss = FAMS[ED.fam].fields.find(f=>f.req && !String(ED[f.k]||"").trim());
    if(miss){ toast("Il manque : "+miss.label+"."); $("#e-"+miss.k).focus(); return; }
    if(ED.id){ S.mine = S.mine.map(c=>c.id===ED.id?{...ED}:c); toast("Carte modifiée."); }
    else { ED.id = "perso-"+Date.now().toString(36); S.mine.push({...ED}); toast("Carte ajoutée à ton album."); }
    ED = {...EMPTY}; S.draft = null; save(); render();
  };
  $("#e-new").onclick = ()=>{ ED={...EMPTY}; S.draft=null; save(); render(); };
  const noimg = $("#e-noimg"); if(noimg) noimg.onclick = ()=>{ ED.img=""; S.draft={...ED}; save(); render(); };
  $("#e-img").onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{ const im = new Image(); im.onload = ()=>{
      const k = Math.min(1, 480/Math.max(im.width,im.height)), cv=document.createElement("canvas");
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      readForm(); ED.img = cv.toDataURL("image/jpeg",.7); S.draft={...ED}; save(); render();
    }; im.src = r.result; };
    r.readAsDataURL(file);
  };
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ ED={...EMPTY,...S.mine.find(c=>c.id===b.dataset.edit)}; render(); scrollTo(0,0); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){ S.mine=S.mine.filter(c=>c.id!==b.dataset.del); if(ED.id===b.dataset.del) ED={...EMPTY}; save(); render(); toast("Carte supprimée."); }
    else { b.dataset.armed="1"; b.textContent="Confirmer ?"; b.classList.add("primary"); }
  });
  $("#p-gen").onclick = ()=>{
    const pack = {format:"memoire-des-luttes/pack",version:1,nom:$("#p-name").value.trim()||"Pack sans nom",signature:null,cartes:S.mine.map(({id,...c})=>c)};
    const out=$("#p-out"); out.value=JSON.stringify(pack,null,1); out.hidden=false; $("#p-copy").hidden=false;
  };
  $("#p-copy").onclick = ()=>{
    const out=$("#p-out");
    navigator.clipboard?.writeText(out.value).then(()=>toast("Pack copié."),()=>{ out.select(); toast("Sélectionné : copie-le à la main."); }) ?? (out.select());
  };
  const doImport = txt=>{
    try{
      const p = JSON.parse(txt);
      if(!p || !Array.isArray(p.cartes) || !p.cartes.length) throw 0;
      const stamp = Date.now().toString(36);
      const cartes = p.cartes.filter(c=>c && c.title).map((c,i)=>({...EMPTY,...c,links:[],rar:["base","rare","legendaire"].includes(c.rar)?c.rar:"base",fam:(FAMS[c.fam]&&!FAMS[c.fam].official)?c.fam:"evenement",id:"imp-"+stamp+"-"+i}));
      if(!cartes.length) throw 0;
      S.imported.push({nom:String(p.nom||"Pack importé").slice(0,60),cartes}); save();
      toast(cartes.length+" carte(s) importée(s). Elles sont dans l'album."); render();
    }catch(e){ toast("Ce texte n'est pas un pack valide."); }
  };
  $("#i-go").onclick = ()=>doImport($("#i-in").value);
  $("#i-file").onchange = e=>{ const f=e.target.files[0]; if(f) f.text().then(doImport); };
}

function vInfos(){
  return `<header class="mast"><div><div class="eyebrow">Comment ça marche</div><h1>Infos</h1></div><div class="mark">Prototype</div></header>
  <div class="stack">
    <section class="panel">
      <h2>Rien ne sort de ton téléphone</h2>
      <p>Pas de compte, pas de GPS, pas de réseau une fois l'app installée. Ta collection est stockée uniquement dans ce navigateur. Personne, y compris le collectif qui fait l'app, ne sait qui joue ni où.</p>
    </section>
    <section class="panel">
      <h2>D'où viennent les cartes</h2>
      <div class="trust">
        <b style="color:var(--gold)">✊ Officiel</b><span>Signé par la clé du collectif. Relu et sourcé. Seuls ces packs tombent dans les boosters.</span>
        <b>✊ Local</b><span>Signé par un groupe local (section, collectif de quartier). Tu choisis de lui faire confiance.</span>
        <b class="muted">Perso</b><span>Fait par n'importe qui, sans signature. Visible dans l'album, jamais dans les boosters.</span>
        <b style="color:var(--red)">🔒 Événement</b><span>Créée par le collectif pour une seule journée. Numérotée, tirage limité, scellée : personne ne peut la modifier.</span>
      </div>
    </section>
    <section class="panel">
      <h2>Comment naît une carte officielle</h2>
      <ol class="stack" style="margin:0;padding-left:20px;gap:8px">
        <li><b>Proposition.</b> N'importe qui écrit une carte dans l'éditeur et l'envoie au collectif, de façon anonyme.</li>
        <li><b>Relecture.</b> Deux personnes du comité éditorial vérifient chaque fait et chaque source, et retravaillent le texte.</li>
        <li><b>Signature.</b> La personne qui garde la clé du collectif signe le pack sur un ordinateur jamais connecté à Internet.</li>
        <li><b>Diffusion.</b> Le pack signé circule de main en main ou en téléchargement. Chaque téléphone vérifie la signature tout seul.</li>
      </ol>
    </section>
    <section class="panel">
      <h2>Ce que fait ce prototype</h2>
      <p>Compteur de manif, boosters avec garantie de rareté, codes de stand, album par séries, éditeur de cartes, export et import de packs.</p>
      <p class="muted">Pas encore là : installation hors ligne sur l'écran d'accueil, scan des QR par l'appareil photo, échange de cartes entre téléphones, vérification des signatures.</p>
    </section>
    <section class="panel">
      <h2>Tout effacer</h2>
      <p>Supprime ta collection, tes cartes perso et ton historique de ce téléphone, d'un seul coup.</p>
      <div class="row"><button class="primary" id="wipe">Tout effacer</button><button id="wipe-no" hidden>Annuler</button></div>
    </section>
  </div>`;
}
function bindInfos(){
  const w=$("#wipe"), n=$("#wipe-no");
  w.onclick = ()=>{
    if(w.dataset.armed){ S=fresh(); ED=null; try{localStorage.removeItem(KEY);}catch(e){} save(); toast("Tout a été effacé."); location.hash="#manif"; render(); }
    else { w.dataset.armed="1"; w.textContent="Oui, tout effacer"; n.hidden=false; }
  };
  n.onclick = ()=>render();
}

/* ============ ROUTAGE ============ */
const VIEWS = {manif:[vManif,bindManif],album:[vAlbum,()=>{}],editeur:[vEditeur,bindEditeur],infos:[vInfos,bindInfos]};
function route(){ const h=location.hash.slice(1); return VIEWS[h]?h:"manif"; }
function render(){
  tick();
  const r = route();
  $("#app").innerHTML = VIEWS[r][0]();
  VIEWS[r][1]();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+r?"page":"false"));
  const b=$("#bdg"); b.hidden = S.boosters<1; b.textContent = S.boosters;
}
addEventListener("hashchange", ()=>{ $("#ov").hidden=true; render(); scrollTo(0,0); });
let lastBoosters = S.boosters, lastActive = !!S.sess;
setInterval(()=>{
  if(!S.sess) return;
  tick();
  const c=$("#clock"); if(c) c.textContent = fmt(S.sess.eff);
  const bf=$("#barfill"); if(bf) bf.style.width = ((S.sess.eff % (BOOSTER_MIN*60e3))/(BOOSTER_MIN*60e3)*100)+"%";
  if(S.boosters!==lastBoosters){ lastBoosters=S.boosters; if($("#ov").hidden) render(); else { const b=$("#bdg"); b.hidden=false; b.textContent=S.boosters; } }
}, 1000);
render();
</script>
